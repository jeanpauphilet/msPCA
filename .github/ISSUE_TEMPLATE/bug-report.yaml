name: Bug report
description: Report a reproducible error or unexpected behaviour in msPCA.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please fill in the sections below so we can reproduce and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reprex
    attributes:
      label: Minimal reproducible example
      description: |
        A self-contained R snippet that demonstrates the problem.
        Prefer `reprex::reprex()` output if possible.
      render: r
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Paste the full error message or unexpected output.
    validations:
      required: true

  - type: textarea
    id: session
    attributes:
      label: Session info
      description: Output of `sessionInfo()` or `devtools::session_info()`.
      render: text
    validations:
      required: true
